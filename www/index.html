<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#C96A6F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nos Repas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#C96A6F; --bordeaux:#722F35; --pink:#F3D3D3; --pink2:#DE9C9C; --cream:#FDF8F5;
  --tab:#EFDFD6; --text:#5A2A2E; --muted:#B07579; --white:#FFFDFB; --beige:#EFE3DA; --ok:#7BAF7B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cream);font-family:'Outfit',system-ui,-apple-system,sans-serif;color:var(--text);font-weight:400}
body{display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
h1,h2,h3{margin:0;font-weight:400}

/* header */
header{background:var(--rose);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;justify-content:center;position:relative;min-height:72px;flex:none}
header h1{font-size:24px;text-align:center}
header .hbtn{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:26px;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
header .hbtn.left{left:8px}
header .hbtn.right{right:8px}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px calc(24px + env(safe-area-inset-bottom));max-width:680px;width:100%;margin:0 auto}

/* tab bar */
nav{flex:none;display:flex;background:var(--tab);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--bordeaux);font-size:14px}
nav button svg{width:40px;height:40px;stroke:var(--bordeaux);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button.active{background:var(--bordeaux);color:#F6E4DF}
nav button.active svg{stroke:#F6E4DF}
nav button.active[data-tab=suivi] svg path:last-child,nav button.active[data-tab=profil] svg{fill:#F6E4DF}

/* common */
.band{background:var(--rose);color:#fff;text-align:center;border-radius:30px;padding:10px 16px;font-size:20px;margin:12px 0}
.band.sm{font-size:17px;padding:8px 14px}
.card{background:var(--pink);border-radius:20px;padding:14px;margin-bottom:12px}
.card.cream{background:#FBF1EB;box-shadow:0 4px 12px rgba(114,47,53,.12)}
.dark{background:var(--bordeaux);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:14px;background:var(--bordeaux);color:#fff;font-size:17px}
.btn.rose{background:var(--rose)}
.btn.ghost{background:transparent;border:2px solid var(--bordeaux);color:var(--bordeaux)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.muted{color:var(--muted);font-size:14px}
.center{text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid #E5C4C4;background:#fff;outline:none}
textarea{min-height:90px;resize:vertical}
label.lbl{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.search{display:flex;align-items:center;background:var(--bordeaux);border-radius:14px;padding:4px 14px;color:#fff;margin-bottom:14px}
.search input{background:transparent;border:0;color:#fff;flex:1;padding:8px 0;font-size:19px}
.search input::placeholder{color:#f5d9d9}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:20px;background:#fff;border:1.5px solid var(--pink2);font-size:15px}
.chip.on{background:var(--bordeaux);color:#fff;border-color:var(--bordeaux)}
.empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:15px}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;background:#fff;color:var(--rose)}

/* profiles */
.profiles{display:flex;justify-content:center;gap:28px;margin:6px 0 14px}
.profiles button{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--rose);font-size:18px}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--bordeaux);display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;border:4px solid transparent;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profiles button.on .avatar{border-color:var(--pink2);box-shadow:0 0 0 3px var(--cream) inset}

/* rings */
.rings{display:flex;justify-content:space-around;margin:6px 0 16px}
.ring{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;line-height:1.4}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:var(--beige)}
.ring .fg{transition:stroke-dashoffset .5s}

/* meal cards */
.meal{background:var(--pink);border-radius:18px;overflow:hidden;margin-bottom:12px}
.meal .mtitle{text-align:center;font-size:21px;padding:8px 10px 6px}
.meal .mtitle small{font-size:13px;color:var(--muted);display:block}
.meal .items{padding:6px 10px 10px}
.item{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:8px 10px;margin-bottom:6px;font-size:15px}
.item .n{flex:1;min-width:0}
.item .n b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .n span{font-size:12px;color:var(--muted)}
.item .x{color:var(--rose);font-size:20px;padding:0 4px}
.meal .adds{display:flex;gap:6px;padding:0 10px 10px}
.meal .adds button{flex:1;background:var(--rose);color:#fff;border-radius:12px;padding:8px;font-size:15px}
.meal .adds button.alt{background:var(--bordeaux)}

/* recipe cards */
.rcard{display:flex;gap:12px;background:var(--pink);border-radius:18px;padding:10px;margin-bottom:10px}
.rcard .ph{width:120px;height:100px;border-radius:12px;background:linear-gradient(#cfe6f7,#9dcc57);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:36px}
.rcard .ph img{width:100%;height:100%;object-fit:cover}
.rcard .info{flex:1;min-width:0;font-size:14px}
.rcard .info h3{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .info .see{color:var(--bordeaux);font-size:13px;margin-top:4px}
.detail{background:#fff;border-radius:14px;padding:12px;margin:-4px 0 12px;font-size:15px}
.detail table{width:100%;border-collapse:collapse}
.detail td{padding:4px 0;border-bottom:1px solid #f3e3e3}
.detail td:last-child{text-align:right;color:var(--muted)}
.typecard{background:var(--pink);border-radius:20px;padding:14px;text-align:center;font-size:24px;margin-bottom:12px}
.typecard .em{font-size:44px;line-height:1.2}

/* calendar */
.cal{background:var(--pink);border-radius:20px;padding:12px 8px 8px;margin-bottom:12px}
.cal .mh{display:flex;justify-content:space-between;align-items:center;font-size:24px;padding:0 6px 6px}
.cal .mh button{font-size:30px;color:var(--bordeaux);width:44px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:18px;row-gap:6px}
.cal .g .h{font-size:16px}
.cal .g .d{position:relative;height:44px;display:flex;align-items:center;justify-content:center}
.cal .g .d span{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal .g .d.sel span{background:var(--bordeaux);color:#fff}
.cal .g .d.today span{outline:2px solid var(--rose)}
.cal .g .d.has::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:var(--pink2)}
.bar{height:38px;border-radius:19px;background:var(--beige);overflow:hidden;display:flex;margin:4px 0 10px;gap:2px;padding:0 1px}
.bar i{flex:1;background:var(--beige);border-radius:3px;transition:background .3s}
.bar i.f{background:var(--bordeaux)}
.bar.p i.f{background:var(--rose)}
.recap-line{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);border-bottom:1px dotted var(--pink2);padding:2px 0}

/* profile */
.weightbox{display:flex;gap:10px;align-items:stretch}
.weightbox .big{font-size:56px;color:var(--bordeaux);line-height:1}
.chart{flex:1;min-width:0}
.chart svg{width:100%;height:190px}
.bigkcal{font-size:60px;color:var(--bordeaux);line-height:1}

/* modal */
.modal{position:fixed;inset:0;background:rgba(60,20,25,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.open{display:flex}
.sheet{background:var(--cream);width:100%;max-width:680px;max-height:92vh;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
.sheet h2{font-size:22px;text-align:center;margin-bottom:12px}
.list{max-height:40vh;overflow-y:auto;border-radius:12px;background:#fff;border:1px solid #EFD5D5}
.list button{width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid #F5E6E6;display:flex;justify-content:space-between;gap:8px}
.list button.on{background:var(--pink)}
.list button small{color:var(--muted)}
.ingrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.ingrow select{flex:1}
.ingrow input{width:84px}
.ingrow .x{color:var(--rose);font-size:22px;padding:0 6px}
.photo-pick{width:100%;height:170px;border-radius:14px;background:var(--pink);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:16px}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--bordeaux);color:#fff;padding:10px 18px;border-radius:14px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
/* v1.1 */
.sheet{position:relative}
.mclose{position:absolute;right:8px;top:6px;width:44px;height:44px;font-size:30px;color:var(--bordeaux);z-index:2}
.mbar{height:8px;border-radius:4px;background:#fff;margin:2px 18px 0;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--bordeaux);border-radius:4px;transition:width .4s}
.mbar.full i{background:var(--rose)}
.over{color:var(--bordeaux);font-weight:500}
.item .n{cursor:pointer}
.item .n em{display:block;font-style:normal;font-size:12px;color:var(--bordeaux);white-space:normal}
.parts{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;margin:8px 0}
.parts td{padding:7px 10px;border-bottom:1px solid #f3e3e3;font-size:15px}
.parts td:last-child{text-align:right;font-weight:500;color:var(--bordeaux);white-space:nowrap}
.parts tr:last-child td{border-bottom:0}
.note{font-size:13px;color:var(--bordeaux);background:#fff;border-radius:10px;padding:6px 10px;margin-top:6px}
.ingname{flex:1;text-align:left;background:#fff;border:1.5px solid #E5C4C4;border-radius:12px;padding:10px 12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ingrow .unit{font-size:13px;color:var(--muted);width:52px}
</style>
</head>
<body>
<header id="header"></header>
<main id="main"></main>
<nav id="nav">
  <button data-tab="suivi"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Suivi</button>
  <button data-tab="recettes"><svg viewBox="0 0 24 24"><path d="M6 13a4 4 0 1 1 1.5-7.7A5 5 0 0 1 16.5 5.3 4 4 0 1 1 18 13v7H6z"/><path d="M6 16h12"/></svg>Recettes</button>
  <button data-tab="batch"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M6 10h12M9 5v2M9 13v3"/></svg>Batch Cooking</button>
  <button data-tab="profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg>Profil</button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ DONNÉES ============ */
const MEALS=[{k:'pdj',l:'Petit-Déjeuner',t:'pdj'},{k:'dej',l:'Déjeuner',t:'repas'},{k:'col',l:'Collation',t:'collation'},{k:'din',l:'Diner',t:'repas'}];
const MEAL_EXTRA={k:'col2',l:'Collation 2',t:'collation'};
const TYPES=[{k:'pdj',l:'Petit-Déjeuner',em:'🥞'},{k:'collation',l:'Collation',em:'🍎'},{k:'repas',l:'Déjeuner/ Dîner',em:'🍲'}];
const DIFF=['Facile','Moyen','Difficile'];
const uid=()=>Math.random().toString(36).slice(2,10);
const todayKey=()=>dkey(new Date());
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
const JOURS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MOIS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
function fmtLong(k){const d=fromKey(k);return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}`;}
function fmtShort(k){const d=fromKey(k);return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;}
const r0=n=>Math.round(n);
const r1=n=>Math.round(n*10)/10;

const SEED_ING=[
 ['Riz blanc (cru)',360,7],['Pâtes (crues)',355,12.5],['Quinoa (cru)',368,14],['Semoule (crue)',360,12],['Pomme de terre',77,2],['Patate douce',86,1.6],['Lentilles (crues)',352,25],['Pois chiches (cuits)',164,9],['Haricots rouges (cuits)',127,8.7],
 ['Blanc de poulet',110,23],['Escalope de dinde',105,24],['Bœuf haché 5%',137,21],['Steak de bœuf',150,26],['Saumon',208,20],['Cabillaud',82,18],['Thon en boîte (au naturel)',116,26],['Crevettes',99,24],['Œuf (entier)',143,12.5],['Jambon blanc',115,20],['Tofu',76,8],
 ['Fromage blanc 0%',45,8],['Skyr',63,11],['Yaourt nature',60,4],['Lait demi-écrémé',46,3.3],['Emmental',380,29],['Feta',264,14],['Mozzarella',280,18],['Parmesan',392,36],
 ['Flocons d\'avoine',375,13],['Pain complet',250,9],['Pain blanc',265,9],['Wrap / tortilla',310,8],['Muesli',370,10],['Whey (poudre)',380,78],
 ['Banane',89,1.1],['Pomme',52,0.3],['Fraises',33,0.7],['Myrtilles',57,0.7],['Orange',47,0.9],['Compote sans sucre',60,0.3],
 ['Brocoli',34,2.8],['Courgette',17,1.2],['Carotte',41,0.9],['Tomate',18,0.9],['Épinards',23,2.9],['Poivron',31,1],['Champignons',22,3.1],['Oignon',40,1.1],['Haricots verts',31,1.8],['Salade verte',15,1.4],['Avocat',160,2],
 ['Huile d\'olive',884,0],['Beurre',717,0.9],['Crème fraîche 15%',170,2.6],['Sauce tomate',35,1.5],['Lait de coco',230,2.3],['Miel',304,0.3],['Chocolat noir 70%',598,8],['Amandes',579,21],['Beurre de cacahuète',588,25],['Sucre',400,0],['Farine de blé',364,10]
];

let S=null;
/* Ingrédients « non divisibles » : nom de l'unité + poids moyen d'une unité (g) */
const DEFAULT_UNITS={'Œuf (entier)':['œuf',55],'Banane':['banane',120],'Pomme':['pomme',150],'Orange':['orange',150],'Wrap / tortilla':['wrap',60],'Avocat':['avocat',150],'Pain complet':['tranche',35],'Pain blanc':['tranche',30],'Yaourt nature':['pot',125]};
function defaultState(){
  return {
    version:2, activeProfile:'p1', day:todayKey(),
    profiles:[
      {id:'p1',name:'Fanny',height:150,kcal:1370,prot:105,split:{pdj:25,dej:35,col:10,din:30},weights:[],photoId:null},
      {id:'p2',name:'Matthieu',height:175,kcal:2600,prot:135,split:{pdj:25,dej:35,col:10,din:30},weights:[],photoId:null}
    ],
    ingredients:SEED_ING.map(([name,kcal,prot])=>({id:uid(),name,kcal,prot})),
    recipes:[], batches:[], days:{}
  };
}
function migrate(){if((S.version||1)<2){for(const i of S.ingredients){const u=DEFAULT_UNITS[i.name];if(u&&!i.unitG){i.unit=u[0];i.unitG=u[1];}}S.version=2;}}
function save(){localStorage.setItem('nosrepas_state',JSON.stringify(S));}
function load(){try{const s=JSON.parse(localStorage.getItem('nosrepas_state'));if(s&&s.profiles)S=s;}catch(e){}if(!S){S=defaultState();S.version=1;}migrate();}

/* Photos dans IndexedDB */
const photoCache={};
let idb=null;
function openDB(){return new Promise(res=>{const r=indexedDB.open('nosrepas',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>{idb=r.result;res();};r.onerror=()=>res();});}
function putPhoto(id,dataUrl){photoCache[id]=dataUrl;if(!idb)return;const tx=idb.transaction('photos','readwrite');tx.objectStore('photos').put(dataUrl,id);}
function delPhoto(id){delete photoCache[id];if(!idb)return;idb.transaction('photos','readwrite').objectStore('photos').delete(id);}
function loadPhotos(){return new Promise(res=>{if(!idb)return res();const st=idb.transaction('photos').objectStore('photos');const req=st.openCursor();req.onsuccess=()=>{const c=req.result;if(c){photoCache[c.key]=c.value;c.continue();}else res();};req.onerror=()=>res();});}
function resizeImage(file,max=900){return new Promise(res=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=r0(w*s);h=r0(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.8));};img.src=url;});}

/* ============ CALCULS ============ */
const prof=()=>S.profiles.find(p=>p.id===S.activeProfile)||S.profiles[0];
const ingById=id=>S.ingredients.find(i=>i.id===id);
const recById=id=>S.recipes.find(r=>r.id===id);
function recipeTotals(r){let g=0,k=0,p=0;for(const it of r.ingredients){const ing=ingById(it.ingId);if(!ing)continue;g+=it.grams;k+=ing.kcal*it.grams/100;p+=ing.prot*it.grams/100;}return {g,kcal:k,prot:p,kcal100:g?k/g*100:0,prot100:g?p/g*100:0};}
function mealShare(mealKey){const sp=prof().split;const key=mealKey==='col2'?'col':mealKey;return (sp[key]||0)/100;}
/* portion (en g) du profil actif pour un repas et une recette */
function portionG(recipe,mealKey,p=prof()){const t=recipeTotals(recipe);if(!t.kcal100)return 0;const target=p.kcal*mealShare(mealKey);return target/(t.kcal100/100);}
function dayData(k=S.day,pid=S.activeProfile){S.days[k]=S.days[k]||{};S.days[k][pid]=S.days[k][pid]||{meals:{}};return S.days[k][pid];}
function dayTotals(k=S.day,pid=S.activeProfile){const d=(S.days[k]||{})[pid];let kcal=0,prot=0;if(d)for(const m in d.meals)for(const it of d.meals[m]){kcal+=it.kcal;prot+=it.prot;}return {kcal,prot};}
function mealTotals(items){let kcal=0,prot=0;for(const it of items||[]){kcal+=it.kcal;prot+=it.prot;}return {kcal,prot};}
function dayHasEntries(k,pid){const d=(S.days[k]||{})[pid];return !!d&&Object.values(d.meals).some(a=>a.length);}
function batchesFor(recipeId){return S.batches.filter(b=>b.recipeId===recipeId&&b.remainingG>5);}
const mealTarget=(mk,p=prof())=>p.kcal*mealShare(mk);
/* --- quantités lisibles --- */
const fmtN=n=>String(r1(n)).replace('.',',');
const plural=(u,n)=>n>1&&!/[sxz]$/.test(u)?u+'s':u;
const shortName=n=>n.replace(/\s*\(.*?\)/g,'').trim();
const roundG=g=>g<20?Math.round(g):Math.round(g/5)*5;
function qtyTxt(ing,g){if(ing&&ing.unitG){const n=g/ing.unitG;return `${fmtN(n)} ${plural(ing.unit||'unité',n)}`;}return `${r0(g)} g`;}
/* portion d'une recette découpée par ingrédient : grammes arrondis, unités entières pour les œufs & co */
function scaledParts(r,targetG){const t=recipeTotals(r);const out={parts:[],g:0,kcal:0,prot:0};if(!t.g||!targetG)return out;const f=targetG/t.g;
  for(const it of r.ingredients){const ing=ingById(it.ingId);if(!ing)continue;let grams=it.grams*f,n=null;
    if(ing.unitG){n=Math.max(1,Math.round(grams/ing.unitG));grams=n*ing.unitG;}else grams=Math.max(1,roundG(grams));
    out.parts.push({ingId:ing.id,name:ing.name,grams,n,unit:ing.unit||''});out.g+=grams;out.kcal+=ing.kcal*grams/100;out.prot+=ing.prot*grams/100;}
  return out;}
function partQty(pt){if(pt.n!=null)return `${pt.n} ${plural(pt.unit||'unité',pt.n)}`;return `${pt.grams} g`;}
function partShort(pt){const nm=shortName(pt.name).toLowerCase();if(pt.n!=null)return nm.startsWith((pt.unit||'').toLowerCase())?partQty(pt):`${partQty(pt)} ${nm}`;return `${pt.grams} g ${nm}`;}
function partsTable(parts){return `<table class="parts">${parts.map(pt=>`<tr><td>${esc(pt.name)}</td><td>${esc(partQty(pt))}${pt.n!=null?` <small class="muted">(${pt.grams} g)</small>`:''}</td></tr>`).join('')}</table>`;}

/* ============ UI GÉNÉRIQUE ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='suivi', sub=null;
function refocus(id){const el=document.getElementById(id);if(!el)return;el.focus();try{const n=el.value.length;el.setSelectionRange(n,n);}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function openModal(html){$('#sheet').innerHTML=`<button class="mclose" onclick="closeModal()" aria-label="Fermer">×</button>`+html;$('#modal').classList.add('open');}
function closeModal(){$('#modal').classList.remove('open');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
let tabStack=[];
function goTab(t){if(t===tab&&!sub){$('#main').scrollTop=0;return;}if(t!==tab){tabStack.push(tab);if(tabStack.length>20)tabStack.shift();}tab=t;sub=null;openDetail=null;render();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>goTab(b.dataset.tab));
function setHeader(title,left,right){$('#header').innerHTML=`${left?`<button class="hbtn left" onclick="${left.fn}">${left.ic}</button>`:''}<h1>${title}</h1>${right?`<button class="hbtn right" onclick="${right.fn}">${right.ic}</button>`:''}`;}
let lastView='';
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const m=$('#main');const v=tab+'/'+(sub||'');const keep=v===lastView?m.scrollTop:0;lastView=v;({suivi:renderSuivi,recettes:renderRecettes,batch:renderBatch,profil:renderProfil})[tab]();m.scrollTop=keep;save();}

/* --- bouton retour Android : revient à l'écran précédent au lieu de fermer l'app --- */
function editorDirty(){return sub==='edit'&&ed&&JSON.stringify(ed)!==edSnap;}
function goBack(){
  if($('#modal').classList.contains('open')){closeModal();return true;}
  if(sub==='edit'){if(editorDirty()&&!confirm('Quitter sans enregistrer la recette ?'))return true;sub=null;render();return true;}
  if(sub){sub=null;render();return true;}
  if(openDetail){openDetail=null;render();return true;}
  if(tab==='recettes'&&(rq||rtype)){rq='';rtype=null;render();return true;}
  if(tab==='batch'&&(bq||btype)){bq='';btype=null;render();return true;}
  if(tabStack.length){tab=tabStack.pop();sub=null;render();return true;}
  if(tab!=='suivi'){tab='suivi';render();return true;}
  if(S.day!==todayKey()){S.day=todayKey();render();return true;}
  return false;
}
function initBack(){const C=window.Capacitor;const App=C&&C.Plugins&&C.Plugins.App;
  if(App&&C.isNativePlatform&&C.isNativePlatform()){App.addListener('backButton',()=>{if(!goBack())App.minimizeApp();});}
  else{history.pushState({nr:1},'');addEventListener('popstate',()=>{if(goBack())history.pushState({nr:1},'');else history.back();});}}
function avatarHtml(p,size){const ph=p.photoId&&photoCache[p.photoId];return `<div class="avatar" style="${size?`width:${size}px;height:${size}px;font-size:${size/2.5}px`:''}">${ph?`<img src="${ph}">`:''}</div>`;}
function profileBar(){return `<div class="profiles">${S.profiles.map(p=>`<button class="${p.id===S.activeProfile?'on':''}" onclick="setProfile('${p.id}')">${avatarHtml(p)}<span>${esc(p.name)}</span></button>`).join('')}<button onclick="editProfile()"><div class="avatar">+</div><span>Ajouter</span></button></div>`;}
function setProfile(id){S.activeProfile=id;render();}
function ringHtml(label,val,max,color){const r=64,c=2*Math.PI*r;const pct=Math.min(1,max?val/max:0);const real=max?val/max*100:0;return `<div class="ring"><svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="${r}"/><circle class="fg" cx="75" cy="75" r="${r}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}"/></svg><div>${label}:<br>${r0(val)}/${r0(max)} ${label==='Calories'?'kcal':'g'}<br><small class="${real>100?'over':'muted'}">${r0(real)} %</small></div></div>`;}

function renderSuivi(){
  if(sub==='cal')return renderCalendrier();

  const p=prof(),tot=dayTotals(),d=dayData();
  const meals=[...MEALS];if(d.meals.col2)meals.splice(3,0,MEAL_EXTRA);
  $('#main').innerHTML=`${profileBar()}

  <div class="center" style="margin:-4px 0 8px"><button class="btn sm ghost" onclick="sub='cal';render()">📅 Calendrier & récap</button></div>
  <div class="rings">${ringHtml('Calories',tot.kcal,p.kcal,'#722F35')}${ringHtml('Protéines',tot.prot,p.prot,'#C96A6F')}</div>
  ${S.day!==todayKey()?`<div class="center" style="margin-bottom:10px"><button class="btn sm ghost" onclick="S.day=todayKey();render()">Revenir à aujourd'hui</button></div>`:''}
  <div class="grid2">${meals.map(m=>mealCard(m,d.meals[m.k]||[])).join('')}</div>

function shiftDay(n){const d=fromKey(S.day);d.setDate(d.getDate()+n);S.day=dkey(d);render();}
function addExtraSnack(){dayData().meals.col2=[];render();}
function mealCard(m,items){const t=mealTotals(items);const target=mealTarget(m.k);const pct=target?Math.min(100,t.kcal/target*100):0;const over=t.kcal-target;
  return `<div class="meal"><div class="mtitle">${m.l}<small>${r0(t.kcal)} / ${r0(target)} kcal · ${r1(t.prot)} g prot${over>1?` · <span class="over">+${r0(over)}</span>`:''}</small><div class="mbar ${pct>=100?'full':''}"><i style="width:${pct}%"></i></div></div>
  <div class="items">${items.length?items.map((it,i)=>`<div class="item"><div class="n" onclick="editItem('${m.k}',${i})"><b>${esc(it.name)}</b><span>${esc(itemQty(it))} · ${r0(it.kcal)} kcal · ${r1(it.prot)} g prot${it.batchId?' · batch':''}</span>${it.parts&&it.parts.length?`<em>${esc(it.parts.map(partShort).join(' · '))}</em>`:''}</div><button class="x" onclick="removeItem('${m.k}',${i})">×</button></div>`).join(''):'<div class="muted center" style="padding:6px">Rien pour le moment</div>'}</div>
  <div class="adds"><button onclick="pickRecipe('${m.k}')">+ Recette</button><button class="alt" onclick="pickFood('${m.k}')">+ Aliment</button></div></div>`;}
function itemQty(it){return it.kind==='food'?qtyTxt(ingById(it.ingId),it.grams):`${r0(it.grams)} g`;}
function removeItem(mk,i){const arr=dayData().meals[mk];const it=arr[i];if(it.batchId){const b=S.batches.find(b=>b.id===it.batchId);if(b)b.remainingG+=it.grams;}arr.splice(i,1);if(mk==='col2'&&!arr.length&&!confirm('Garder la collation 2 ?'))delete dayData().meals.col2;render();}
/* --- modifier la quantité d'une ligne déjà notée --- */
function editItem(mk,i){const it=dayData().meals[mk][i];const ing=it.kind==='food'&&ingById(it.ingId);pick={mk,i,unitG:ing&&ing.unitG?ing.unitG:0,unit:ing?ing.unit:'',val:ing&&ing.unitG?r1(it.grams/ing.unitG):r0(it.grams)};
  openModal(`<h2>${esc(it.name)}</h2>${it.parts&&it.parts.length?partsTable(it.parts):''}
  <label class="lbl">${pick.unitG?`Nombre (${esc(plural(pick.unit,2))})`:'Quantité totale (g)'}</label><input type="number" inputmode="decimal" id="ei-v" value="${pick.val}">
  <div class="chips" style="margin-top:8px">${[0.5,0.75,1.25,1.5,2].map(x=>`<button class="chip" onclick="$('#ei-v').value=${pick.unitG?`Math.max(1,Math.round(${pick.val}*${x}))`:`Math.round(${pick.val}*${x})`}">×${String(x).replace('.',',')}</button>`).join('')}</div>
  <button class="btn full" style="margin-top:14px" onclick="saveItem()">Enregistrer</button><button class="btn full ghost" style="margin-top:8px" onclick="closeModal();removeItem('${mk}',${i})">Retirer du repas</button>`);}
function saveItem(){const it=dayData().meals[pick.mk][pick.i];let v=+$('#ei-v').value;if(!v)return toast('Quantité manquante');const newG=pick.unitG?v*pick.unitG:v;const old=it.grams;
  const r=it.kind==='recipe'&&recById(it.recipeId);
  if(r&&!it.batchId){const sp=scaledParts(r,newG);Object.assign(it,{grams:sp.g,kcal:sp.kcal,prot:sp.prot,parts:sp.parts});}
  else{const f=newG/old;Object.assign(it,{grams:newG,kcal:it.kcal*f,prot:it.prot*f});}
  if(it.batchId){const b=S.batches.find(b=>b.id===it.batchId);if(b)b.remainingG=Math.max(0,b.remainingG-(it.grams-old));}
  closeModal();render();toast('Quantité modifiée');}

/* --- ajouter une recette à un repas --- */
let pick={};
function pickRecipe(mk){const m=[...MEALS,MEAL_EXTRA].find(x=>x.k===mk);pick={mk,type:m.t,q:'',recipeId:null,mult:1,grams:null,whole:false,batchId:null,also:[]};renderPick();}
/* quantité visée (g de plat) pour le profil p, selon le choix portions / plat entier / grammes */
function pickTarget(r,p){const t=recipeTotals(r);const pg=portionG(r,pick.mk,p);if(pick.whole)return t.g;if(pick.grams!=null){const own=portionG(r,pick.mk);return p.id===S.activeProfile?pick.grams:(own?pick.grams/own*pg:pg);}return pg*pick.mult;}
function pickResult(r,p){const t=recipeTotals(r);const g=pickTarget(r,p);if(pick.batchId)return {parts:[],g,kcal:g*t.kcal100/100,prot:g*t.prot100/100};return scaledParts(r,g);}
function renderPick(){
  const list=S.recipes.filter(r=>(!pick.q||r.name.toLowerCase().includes(pick.q)||r.ingredients.some(i=>(ingById(i.ingId)||{}).name?.toLowerCase().includes(pick.q)))).sort((a,b)=>(a.type===pick.type?0:1)-(b.type===pick.type?0:1)||(b.lastUsed||0)-(a.lastUsed||0));
  const r=pick.recipeId&&recById(pick.recipeId);let detail='';
  if(r){const p=prof();const t=recipeTotals(r);const res=pickResult(r,p);const bs=batchesFor(r.id);const target=mealTarget(pick.mk);const others=S.profiles.filter(x=>x.id!==p.id);
    detail=`<div class="card cream" style="margin-top:12px" id="pk-detail"><div style="font-size:18px">${esc(r.name)}</div><div class="muted">Portion de ${esc(p.name)} : ${r0(mealShare(pick.mk)*100)} % de ${p.kcal} kcal = ${r0(target)} kcal pour ce repas</div>
    <label class="lbl">Nombre de portions</label><div class="chips">${[0.5,1,1.5,2].map(x=>`<button class="chip ${pick.grams==null&&!pick.whole&&pick.mult===x?'on':''}" onclick="pick.mult=${x};pick.grams=null;pick.whole=false;renderPick()">${String(x).replace('.',',')}</button>`).join('')}<button class="chip ${pick.whole?'on':''}" onclick="pick.whole=true;pick.grams=null;renderPick()">Plat entier</button></div>
    <label class="lbl">ou quantité totale exacte (g)</label><input type="number" inputmode="decimal" placeholder="grammes" value="${pick.grams??''}" onchange="pick.grams=this.value?+this.value:null;pick.whole=false;renderPick()">
    ${bs.length?`<label class="lbl">Prendre dans un batch (plat déjà cuisiné)</label><div class="chips"><button class="chip ${!pick.batchId?'on':''}" onclick="pick.batchId=null;renderPick()">Non, je cuisine</button>${bs.map(b=>`<button class="chip ${pick.batchId===b.id?'on':''}" onclick="pick.batchId='${b.id}';renderPick()">Batch du ${fmtShort(b.date)} (${r0(b.remainingG)} g restants)</button>`).join('')}</div>`:''}
    ${pick.batchId?`<div class="note">Servir ${r0(res.g)} g du plat préparé.</div>`:`<label class="lbl">À peser pour ${esc(p.name)} (crus)</label>${partsTable(res.parts)}`}
    <div class="band sm" style="margin:10px 0 4px">${r0(res.g)} g → ${r0(res.kcal)} kcal · ${r1(res.prot)} g prot</div>
    ${res.kcal>target+1?`<div class="note">Dépasse l'objectif du repas de ${r0(res.kcal-target)} kcal : pas grave, ce sera noté quand même.</div>`:''}
    ${others.length?`<label class="lbl">On mange la même chose ? Ajouter aussi la portion de :</label><div class="chips">${others.map(o=>{const on=pick.also.includes(o.id);const ro=pickResult(r,o);return `<button class="chip ${on?'on':''}" onclick="toggleAlso('${o.id}')">${on?'✓ ':''}${esc(o.name)} (${r0(ro.g)} g · ${r0(ro.kcal)} kcal)</button>`;}).join('')}</div>
    ${pick.also.length&&!pick.batchId?pick.also.map(id=>{const o=S.profiles.find(x=>x.id===id);return o?`<label class="lbl">À peser pour ${esc(o.name)}</label>${partsTable(pickResult(r,o).parts)}`:'';}).join(''):''}`:''}
    <button class="btn full" style="margin-top:12px" onclick="confirmPick()">Ajouter au repas</button></div>`;}
  openModal(`<h2>Choisir une recette</h2><div class="search"><input type="search" id="pk-in" placeholder="Rechercher..." value="${esc(pick.q)}" oninput="pick.q=this.value.toLowerCase();renderPick();refocus('pk-in')"></div>
  <div class="list">${list.length?list.map(x=>`<button class="${x.id===pick.recipeId?'on':''}" onclick="selectPick('${x.id}')"><span>${esc(x.name)}</span><small>${TYPES.find(t=>t.k===x.type)?.l||''}${batchesFor(x.id).length?' · 🧊':''}</small></button>`).join(''):'<div class="empty">Aucune recette. Crée-en dans l\'onglet Recettes.</div>'}</div>${detail}`);
}
function selectPick(id){pick.recipeId=id;pick.grams=null;pick.whole=false;pick.batchId=null;renderPick();const d=document.getElementById('pk-detail');if(d)d.scrollIntoView({behavior:'smooth',block:'start'});}
function toggleAlso(id){pick.also=pick.also.includes(id)?pick.also.filter(x=>x!==id):[...pick.also,id];renderPick();}
function confirmPick(){const r=recById(pick.recipeId);if(!r)return;
  const who=[prof(),...pick.also.map(id=>S.profiles.find(x=>x.id===id)).filter(Boolean)];
  const results=who.map(p=>({p,res:pickResult(r,p)}));if(!results[0].res.g)return;
  if(pick.batchId){const b=S.batches.find(b=>b.id===pick.batchId);const need=results.reduce((a,x)=>a+x.res.g,0);if(b){if(need>b.remainingG+1&&!confirm(`Il ne reste que ${r0(b.remainingG)} g dans ce batch. Continuer ?`))return;b.remainingG=Math.max(0,b.remainingG-need);}}
  for(const {p,res} of results){const d=dayData(S.day,p.id);const arr=d.meals[pick.mk]=d.meals[pick.mk]||[];
    arr.push({kind:'recipe',recipeId:r.id,name:r.name,grams:res.g,kcal:res.kcal,prot:res.prot,batchId:pick.batchId,parts:res.parts});}
  r.usageCount=(r.usageCount||0)+1;r.lastUsed=Date.now();closeModal();render();toast(results.length>1?`Ajouté pour ${results.map(x=>x.p.name).join(' et ')}`:'Ajouté');}

/* --- ajouter un aliment simple --- */
function pickFood(mk){pick={mk,q:'',ingId:null,grams:100,newName:'',newK:'',newP:'',newU:'',newUG:''};renderFood();}
function renderFood(){const list=S.ingredients.filter(i=>!pick.q||i.name.toLowerCase().includes(pick.q)).sort((a,b)=>a.name.localeCompare(b.name));const ing=pick.ingId&&ingById(pick.ingId);
  openModal(`<h2>Ajouter un aliment</h2><div class="search"><input type="search" id="fd-in" placeholder="Rechercher un ingrédient..." value="${esc(pick.q)}" oninput="pick.q=this.value.toLowerCase();renderFood();refocus('fd-in')"></div>
  <div class="list">${list.map(i=>`<button class="${i.id===pick.ingId?'on':''}" onclick="pick.ingId='${i.id}';pick.grams=${i.unitG||100};renderFood()"><span>${esc(i.name)}</span><small>${i.kcal} kcal · ${i.prot} g / 100 g${i.unitG?` · 1 ${esc(i.unit)} ≈ ${i.unitG} g`:''}</small></button>`).join('')}</div>
  ${ing?`<div class="card cream" style="margin-top:12px"><div style="font-size:18px">${esc(ing.name)}</div>
  ${ing.unitG?`<label class="lbl">Nombre (${esc(plural(ing.unit,2))})</label><input type="number" inputmode="decimal" step="0.5" value="${r1(pick.grams/ing.unitG)}" onchange="pick.grams=+this.value*${ing.unitG};renderFood()">`:`<label class="lbl">Quantité (g)</label><input type="number" inputmode="decimal" value="${pick.grams}" onchange="pick.grams=+this.value;renderFood()">`}
  <div class="band sm" style="margin:14px 0 8px">${esc(qtyTxt(ing,pick.grams))} → ${r0(ing.kcal*pick.grams/100)} kcal · ${r1(ing.prot*pick.grams/100)} g prot</div><button class="btn full" onclick="confirmFood()">Ajouter au repas</button></div>`:
  `<details style="margin-top:12px"><summary class="muted">Ingrédient introuvable ? En créer un</summary>${newIngForm('renderFood')}</details>`}`);}
function newIngForm(back){return `<label class="lbl">Nom</label><input type="text" id="ni-name" value="${esc(pick.newName||'')}"><div class="grid2"><div><label class="lbl">kcal / 100 g</label><input type="number" inputmode="decimal" id="ni-k" value="${pick.newK||''}"></div><div><label class="lbl">Protéines g / 100 g</label><input type="number" inputmode="decimal" id="ni-p" value="${pick.newP||''}"></div></div>
  <div class="grid2"><div><label class="lbl">Se compte à l'unité ? (ex. œuf)</label><input type="text" id="ni-u" placeholder="optionnel" value="${esc(pick.newU||'')}"></div><div><label class="lbl">Poids d'une unité (g)</label><input type="number" inputmode="decimal" id="ni-ug" placeholder="optionnel" value="${pick.newUG||''}"></div></div>
  <button class="btn full rose" style="margin-top:10px" onclick="createIng('${back}')">Créer l'ingrédient</button>`;}
function readIngForm(){const name=$('#ni-name').value.trim(),kcal=+$('#ni-k').value,prot=+$('#ni-p').value,unit=$('#ni-u').value.trim(),unitG=+$('#ni-ug').value||0;return {name,kcal,prot,unit:unitG?(unit||'unité'):'',unitG};}
function createIng(back){const f=readIngForm();if(!f.name)return toast('Nom manquant');const ing={id:uid(),...f};if(!ing.unitG){delete ing.unit;delete ing.unitG;}S.ingredients.push(ing);save();
  if(back==='renderFood'){pick.ingId=ing.id;pick.grams=ing.unitG||100;pick.q='';renderFood();}
  else if(back==='edpick'){setEdIng(ing.id);}
  else{sub='ing';render();}toast('Ingrédient créé');}
function confirmFood(){const ing=ingById(pick.ingId);const g=+pick.grams||0;if(!g)return;const arr=dayData().meals[pick.mk]=dayData().meals[pick.mk]||[];arr.push({kind:'food',ingId:ing.id,name:ing.name,grams:g,kcal:ing.kcal*g/100,prot:ing.prot*g/100});closeModal();render();toast('Ajouté');}

/* ============ CALENDRIER ============ */
let calMonth=null;
function renderCalendrier(){
  setHeader('Calendrier',{ic:'←',fn:'goBack()'});
  const p=prof();if(!calMonth){const d=fromKey(S.day);calMonth={y:d.getFullYear(),m:d.getMonth()};}
  const first=new Date(calMonth.y,calMonth.m,1);const start=(first.getDay()+6)%7;const nd=new Date(calMonth.y,calMonth.m+1,0).getDate();

  const tot=dayTotals(),d=dayData();const meals=[...MEALS];if(d.meals.col2)meals.splice(3,0,MEAL_EXTRA);
  const bar=(v,max,cls)=>`<div class="bar ${cls}">${Array.from({length:10},(_,i)=>`<i class="${v/max*10>i+.5?'f':''}"></i>`).join('')}</div>`;
  $('#main').innerHTML=`<div class="cal"><div class="mh"><button onclick="calShift(-1)">‹</button><span>${MOIS[calMonth.m]} ${calMonth.y}</span><button onclick="calShift(1)">›</button></div>
  <div class="g">${['L','M','M','J','V','S','D'].map(h=>`<div class="h">${h}</div>`).join('')}${cells}</div></div>
  <h2 class="center" style="font-size:26px;margin:10px 0">${fmtLong(S.day)}</h2>
  <div class="card"><div class="band sm" style="margin:0 0 10px;text-align:left">📊 Récapitulatif du jour — ${esc(p.name)}</div>
  <div style="font-size:20px">Calories : ${r0(tot.kcal)} / ${p.kcal} kcal</div>${bar(tot.kcal,p.kcal,'')}
  <div style="font-size:20px">Protéines : ${r1(tot.prot)} / ${p.prot} g</div>${bar(tot.prot,p.prot,'p')}
  ${meals.map(m=>{const items=d.meals[m.k]||[];const t=mealTotals(items);return `<div style="font-size:19px;margin-top:8px">${m.l} (${r0(t.kcal)} Kcal)</div>${items.length?items.map(it=>`<div class="recap-line"><span>${esc(it.name)} · ${esc(itemQty(it))}${it.parts&&it.parts.length?`<br><small>${esc(it.parts.map(partShort).join(' · '))}</small>`:''}</span><span>${r0(it.kcal)} kcal · ${r1(it.prot)} g</span></div>`).join(''):'<div class="recap-line"><span>—</span></div>'}`;}).join('')}

let detailMeal=null;

function recipeDetail(r){const t=recipeTotals(r);const p=prof();const mk=detailMeal&&detailMeal.r===r.id?detailMeal.mk:defMeal(r);const sp=scaledParts(r,portionG(r,mk,p));

  ${list.length?list.map(card).join(''):'<div class="empty">Aucun plat préparé. Lance un batch depuis une recette.</div>'}

function newBatch(recipeId){pick={recipeId:recipeId||null,mult:1,q:'',date:todayKey()};renderNewBatch();}

function confirmBatch(){const r=recById(pick.recipeId);const t=recipeTotals(r);S.batches.push({id:uid(),recipeId:r.id,date:pick.date||todayKey(),initialG:t.g*pick.mult,remainingG:t.g*pick.mult});closeModal();tab='batch';sub=null;render();toast('Batch enregistré');}

/* ============ PROFIL ============ */
function renderProfil(){const p=prof();
  setHeader(`Mon Profil - ${esc(p.name)} (${p.height||'?'}cm)`,null,{ic:'✎',fn:`editProfile('${p.id}')`});

  ${ws.length?`<details style="margin-top:8px"><summary class="muted">Historique (${ws.length})</summary>${ws.slice().reverse().map((w,i)=>`<div class="recap-line"><span>${fmtShort(w.date)}/${w.date.slice(0,4)}</span><span>${r1(w.kg)} kg <button class="x" style="color:var(--rose)" onclick="delWeight('${w.date}')">×</button></span></div>`).join('')}</details>`:''}</div>
  <div class="band">Mon objectif Calorique</div>
  <div class="card" style="padding:0;overflow:hidden"><div class="row" style="padding:22px 18px"><div class="bigkcal grow">${p.kcal} kcal</div><button class="btn" onclick="editProfile('${p.id}')">✎ Modifier</button></div><div class="dark center" style="padding:14px;font-size:22px">Protéines ciblées : ${p.prot} g</div></div>
  <div class="card cream"><div style="font-size:18px;margin-bottom:6px">Répartition des repas</div><div class="muted">Sert à calculer « ta portion » pour chaque repas.</div>
  <div class="grid2" style="margin-top:8px">${MEALS.map(m=>`<div class="recap-line"><span>${m.l}</span><span>${p.split[m.k]} % · ${r0(p.kcal*p.split[m.k]/100)} kcal</span></div>`).join('')}</div>
  <div class="muted" style="margin-top:6px">${Object.values(p.split).reduce((a,b)=>a+b,0)!==100?'⚠️ Le total ne fait pas 100 %':'La collation 2 utilise la part Collation.'}</div></div>`;}
function weightChart(ws){const lim=new Date();lim.setMonth(lim.getMonth()-4);const pts=ws.filter(w=>fromKey(w.date)>=lim);if(pts.length<1)return '<div class="empty">Ajoute une pesée pour voir la courbe</div>';
  const W=320,H=180,L=34,B=22,T=10;const t0=fromKey(pts[0].date).getTime(),t1=Math.max(fromKey(pts[pts.length-1].date).getTime(),t0+864e5);let mn=Math.floor(Math.min(...pts.map(p=>p.kg))-1),mx=Math.ceil(Math.max(...pts.map(p=>p.kg))+1);
  const X=t=>L+(t-t0)/(t1-t0)*(W-L-8),Y=v=>T+(mx-v)/(mx-mn)*(H-T-B);let grid='';for(let v=mn;v<=mx;v++)grid+=`<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#ddd"/><text x="${L-4}" y="${Y(v)+4}" font-size="9" text-anchor="end" fill="#722F35">${v}</text>`;
  const d=pts.map((p,i)=>(i?'L':'M')+X(fromKey(p.date).getTime())+','+Y(p.kg)).join(' ');
  const labels=[pts[0],pts[pts.length-1]].map(p=>`<text x="${X(fromKey(p.date).getTime())}" y="${H-6}" font-size="9" text-anchor="middle" fill="#722F35">${fmtShort(p.date)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="#722F35" stroke-width="2"/>${grid}<path d="${d}" fill="none" stroke="#722F35" stroke-width="2"/>${pts.map(p=>`<circle cx="${X(fromKey(p.date).getTime())}" cy="${Y(p.kg)}" r="3.5" fill="#722F35"/>`).join('')}${labels}</svg>`;}
function addWeight(){pick={date:todayKey(),kg:''};openModal(`<h2>Nouvelle pesée</h2><label class="lbl">Date</label><input type="date" value="${pick.date}" onchange="pick.date=this.value"><label class="lbl">Poids (kg)</label><input type="number" inputmode="decimal" step="0.1" placeholder="ex. 54.3" onchange="pick.kg=this.value"><button class="btn full" style="margin-top:16px" onclick="confirmWeight()">Enregistrer</button>`);}
function confirmWeight(){const kg=+pick.kg;if(!kg)return toast('Poids manquant');const p=prof();p.weights=p.weights.filter(w=>w.date!==pick.date);p.weights.push({date:pick.date,kg});closeModal();render();}
function delWeight(date){const p=prof();p.weights=p.weights.filter(w=>w.date!==date);render();}
function editProfile(id){const p=id?S.profiles.find(x=>x.id===id):{id:null,name:'',height:'',kcal:2000,prot:120,split:{pdj:25,dej:35,col:10,din:30},weights:[],photoId:null};pick={...p,split:{...p.split},photo:p.photoId?photoCache[p.photoId]:null};renderProfileForm();}
function renderProfileForm(){openModal(`<h2>${pick.id?'Modifier le profil':'Nouveau profil'}</h2>
  <label class="photo-pick" for="pp-in" style="height:120px">${pick.photo?`<img src="${pick.photo}">`:'📷 Photo de profil (optionnel)'}</label><input type="file" id="pp-in" accept="image/*" style="display:none" onchange="ppPhoto(this)">
  <label class="lbl">Prénom</label><input type="text" value="${esc(pick.name)}" oninput="pick.name=this.value">
  <label class="lbl">Taille (cm)</label><input type="number" inputmode="numeric" value="${pick.height}" oninput="pick.height=+this.value">
  <div class="grid2"><div><label class="lbl">Objectif kcal / jour</label><input type="number" inputmode="numeric" value="${pick.kcal}" oninput="pick.kcal=+this.value"></div><div><label class="lbl">Protéines pures / jour (g)</label><input type="number" inputmode="numeric" value="${pick.prot}" oninput="pick.prot=+this.value"></div></div>
  <label class="lbl">Répartition des repas (%)</label><div class="grid2">${MEALS.map(m=>`<div><span class="muted">${m.l}</span><input type="number" inputmode="numeric" value="${pick.split[m.k]}" oninput="pick.split.${m.k}=+this.value"></div>`).join('')}</div>
  <button class="btn full" style="margin-top:16px" onclick="saveProfile()">Enregistrer</button>${pick.id&&S.profiles.length>1?`<button class="btn full ghost" style="margin-top:8px" onclick="delProfile('${pick.id}')">Supprimer ce profil</button>`:''}`);}
async function ppPhoto(inp){const f=inp.files[0];if(!f)return;pick.photo=await resizeImage(f,300);renderProfileForm();}
function saveProfile(){if(!pick.name.trim())return toast('Prénom manquant');let p=pick.id?S.profiles.find(x=>x.id===pick.id):null;if(!p){p={id:uid(),weights:[],photoId:null};S.profiles.push(p);S.activeProfile=p.id;}
  Object.assign(p,{name:pick.name.trim(),height:pick.height,kcal:pick.kcal,prot:pick.prot,split:pick.split});if(pick.photo&&pick.photo!==(p.photoId&&photoCache[p.photoId])){if(p.photoId)delPhoto(p.photoId);p.photoId=uid();putPhoto(p.photoId,pick.photo);}closeModal();render();}
function delProfile(id){if(!confirm('Supprimer ce profil et son suivi ?'))return;S.profiles=S.profiles.filter(p=>p.id!==id);for(const k in S.days)delete S.days[k][id];S.activeProfile=S.profiles[0].id;closeModal();render();}

/* ============ INIT ============ */
(async()=>{load();S.day=todayKey();await openDB();await loadPhotos();render();initBack();})();
</script>
</body>
</html>
